# Transcribed from the worked example in the source design conversation. The
# criteria predate this schema and were authored under an INV/AC/PRES tier
# vocabulary; the mapping to verifier/verification_stage/obligation is the
# transcription. Restored after being deleted in 0bdc14c.
schema_version: 1
tracker: jira
item: BUG-4471
registry_revision: "9f2c1ab"
registry_selections: [INV-2]
mandates: [data-integrity, correctness, resource, observability, blast-radius]
non_goals:
  - "retry button behaviour — split to BUG-4488"
  - "export performance below 50k rows — no evidence of defect"
claims:
  - id: C1
    text: "export fails above 50k rows"
  - id: C2
    text: "regression since ~July — unverified secondhand"
  - id: C3
    text: "empty file left at destination on hang"
coupling:
  - id: CPL-recon
    kind: consumer
    target: "jobs/reconcile.py"
  - id: CPL-manifest-glob
    kind: directory-convention
    target: "exports/"
  - id: CPL-alerts
    kind: alert
    target: "alerts/EXP-1,EXP-2,EXP-3"
  - id: CPL-capacity
    kind: capacity
    target: "worker pool concurrency"
entails:
  CPL-recon: PRES-1
  CPL-manifest-glob: PRES-2
  CPL-alerts: PRES-3
  CPL-capacity: PRES-4
entries:
  - id: INV-2
    statement: "destination holds a file only if its row count equals the manifest"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [data-integrity]
    traces: [C3, INV-2]
    observation: "force a timeout mid-export, list the destination"
    decision: "no file present, or row count equals manifest"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  - id: AC-1
    statement: "export of 500k rows reaches SUCCEEDED inside the gateway budget"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [C1]
    observation: "run a 500k export against staging, warm cache"
    decision: "terminal status SUCCEEDED within the stated budget"
    quantitative: true
    quantity:
      value: "240"
      unit: "seconds"
      conditions: "staging, warm cache, single concurrent export, 500k rows; bounded by the 5 minute gateway timeout"
    test_role: change
    baseline: assertion_fail
  - id: AC-2
    statement: "every export terminates in exactly one terminal status and emits duration and row count"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness, observability]
    traces: [C1, C3]
    observation: "drive each terminal path, read emitted metrics"
    decision: "one status from the enum, both metrics present"
    quantitative: false
    test_role: change
    baseline: expected_error
    error_code: "ImportError"
    error_pattern: "cannot import name 'TerminalStatus'"
  - id: AC-4
    statement: "on timeout the attempt count is present and no attempt leaves a file at destination"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [data-integrity, observability]
    traces: [C3, INV-2]
    observation: "force repeated timeouts, inspect status payload and destination"
    decision: "attempt count at least one and destination empty"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  - id: PRES-1
    statement: "the reconcile job completes against every terminal export state, including no-file"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [blast-radius]
    traces: [CPL-recon]
    observation: "run reconcile against a destination with no file"
    decision: "exit code 0"
    quantitative: false
    test_role: preservation
    baseline: pass
  - id: PRES-2
    statement: "manifest files are not visible to consumers globbing the export destination"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [blast-radius]
    traces: [CPL-manifest-glob]
    observation: "glob the destination after a successful export"
    decision: "no manifest path in the result set"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  - id: PRES-3
    statement: "alerts EXP-1, EXP-2 and EXP-3 fire on the same conditions before and after the status change"
    verifier: independent_review
    verification_stage: pre_merge
    obligation: must
    mandate: [blast-radius, observability]
    traces: [CPL-alerts]
    observation: "reviewer diffs each alert expression against the new status enum"
    decision: "reviewer verdict per alert"
    quantitative: false
  - id: PRES-4
    statement: "concurrent export capacity is at least the current level"
    verifier: mechanical
    verification_stage: production
    obligation: must
    mandate: [resource, blast-radius]
    traces: [CPL-capacity]
    observation: "worker pool saturation metric over 24h"
    decision: "sustained concurrency at or above the pre-change baseline"
    quantitative: false
    handoff:
      owner: "platform-oncall"
      trigger: "24h after deploy"
      verification_method: "grafana panel export.concurrency.sustained"
      evidence_destination: "runs/BUG-4471/handoff/"
      failure_transition: "reopen BUG-4471 and revert the writer bound"
  - id: W-C2
    statement: "the July regression claim remains unverified"
    verifier: observation
    verification_stage: production
    obligation: watch
    mandate: [correctness]
    traces: [C2]
    observation: "export failure rate by week, back to June"
    decision: "recorded, not gated"
    quantitative: false
