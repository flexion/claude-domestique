# Boundary for domestique-5bl — a refine skill so modus changes agent behaviour.
#
# Drafted by following modus/skills/refine/SKILL.md, which is the artifact this
# boundary is about. The skill was written far enough to be followed, then used to
# produce this. If this boundary is usable, the skill works.
#
# NOT FROZEN. No review yet.
schema_version: 1
tracker: beads
item: domestique-5bl
registry_revision: "none"
registry_selections: []
mandates: [correctness, usability]
non_goals:
  - "a rule or hook that gates automatically; a skill cannot do that and this item does not attempt it"
  - "the drafting script and prompt of gh-158"
  - "deriving goal and obligations from repo and history, which is gh-159"
  - "any change to lint-boundary.js or to the manifest schema"
  - "installing modus as a plugin in this session"
interpretation:
  goal:
    statement: "an agent produces a frozen definition of done for an item before it writes code"
    provenance: stated
    support:
      - kind: item_locator
        ref: "description#2"
  problem:
    statement: "installing modus changes no agent behaviour, so nothing prompts an agent to refine"
    provenance: stated
    support:
      - kind: item_locator
        ref: "description#1"
      - kind: repo_path
        ref: "modus/.claude-plugin/plugin.json"
  claim_provenance:
    C1:
      provenance: stated
      support:
        - kind: item_locator
          ref: "description#1"
        - kind: repo_path
          ref: "modus/"
    C2:
      # The item says a skill is not injected at all. The repository's own
      # reference says skill DISCOVERY is automatic-context: the description is
      # surfaced without the agent asking. What is not guaranteed is compliance.
      provenance: contradicted
      support:
        - kind: repo_path
          ref: "docs/claude/skills.yml"
    C3:
      provenance: stated
      support:
        - kind: item_locator
          ref: "description#3"
        - kind: repo_path
          ref: "scripts/probe-skill.js"
  corrections:
    - about: C2
      item_assertion: "a skill is invoked, not injected, so this does not gate anything"
      repo_finding: >-
        docs/claude/skills.yml records skill discovery as automatic-context, so the description
        reaches the agent without being asked for; only acting on it is discretionary
      resolution: item_wrong
      # The obligation reads the same either way. A skill still cannot guarantee
      # the gate, so nothing about what gets built changes.
      moves_surface: false
      support:
        - kind: repo_path
          ref: "docs/claude/skills.yml"
  gaps:
    - element: "what description wording actually causes an agent to invoke the skill"
      filled_from:
        kind: repo_path
        ref: "scripts/validate-plugins.js"
claims:
  - id: C1
    text: "modus has no skills, rules, hooks or context"
  - id: C2
    text: "a skill is invoked rather than injected, so it gates nothing"
  - id: C3
    text: "the skill ships in modus and is exercised from source without installing it"
coupling:
  # None of these three are in the item. All were found by reading the repo, and
  # each one fails the build if missed.
  - id: CPL-1
    kind: consumer
    target: "metadata/skill-catalog.json — validate:plugins fails on a skill with no entry"
  - id: CPL-2
    kind: consumer
    target: "modus/.claude-plugin/plugin.json — must declare skills for the plugin to ship them"
  - id: CPL-3
    kind: contract
    target: "scripts/validate-plugins.js — a public description must begin with Use when"
entails:
  CPL-1: AC-1
  CPL-2: AC-5
  CPL-3: AC-5
entries:
  # Split from one entry that declared assertion_fail and would have passed on
  # base: "validate:plugins exits zero" is true before the skill exists, so it
  # proved nothing. Registration is false on base; validation staying green is
  # true on both. Different baselines, so different entries.
  - id: AC-1
    statement: "the skill catalog registers modus:refine"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [C1, CPL-1]
    observation: "read metadata/skill-catalog.json and look for an entry named modus:refine"
    decision: "the entry is present"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  - id: AC-5
    statement: "repository validation stays green with the skill present"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [CPL-2, CPL-3]
    observation: "run npm run validate:plugins"
    decision: "it exits zero"
    quantitative: false
    test_role: preservation
    baseline: pass
  # Was an assertion about a symlink at .claude/skills/refine. The symlink is gone:
  # --plugin-dir loads the source directory on a fresh agent, so the property is
  # now guaranteed by the mechanism rather than by a link someone has to maintain.
  # The obligation still holds — what a run exercises must be the source — so it is
  # restated against the thing that now provides it.
  - id: AC-2
    statement: "a fresh agent loads the skill from the plugin source directory"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [C3]
    # The probe reports skills that were INVOKED, not skills that are available,
    # so asking it to expect a firing is the wrong check here: listing skills does
    # not invoke one. The response text is what carries the list.
    observation: "run the probe with a prompt asking the agent to list its skills; read the response"
    decision: "modus:refine appears in the response"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  # Linting a drafted boundary is necessary and does not measure refinement. Every
  # defect found by review in this repository linted clean first: "judged usable"
  # as a decision, "recorded, not gated" on a watch entry, an observation naming
  # two of three banned categories. AC-6 keeps the cheap check; this entry is the
  # one that can fail on a schema-valid document that decides nothing.
  - id: AC-3
    statement: "a reviewer can evaluate every decision in a boundary the skill produced"
    verifier: independent_review
    verification_stage: pre_merge
    obligation: must
    mandate: [usability]
    traces: [C1]
    observation: >-
      give a drafted boundary and its item to a reviewer that did not draft it; ask which
      decisions it cannot evaluate
    decision: "the returned list is empty"
    quantitative: false
  - id: AC-6
    statement: "a boundary the skill produced lints without failures"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [C1]
    observation: "lint the drafted boundary with the item's part list supplied"
    decision: "failures is empty"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  # Split from AC-6, which joined two separately falsifiable claims. Zero failures
  # with three exempt checks reads as clean and is not: an exempt check declared it
  # had no domain and did not run. That is what hid a citation pointing at a part
  # the item does not have.
  - id: AC-7
    statement: "every citation in a drafted boundary resolves to a real part of the item"
    verifier: mechanical
    verification_stage: pre_merge
    obligation: must
    mandate: [correctness]
    traces: [C1]
    observation: "lint the drafted boundary with the part list supplied; count the exempt checks"
    decision: "no check is exempt"
    quantitative: false
    test_role: change
    baseline: assertion_fail
  - id: AC-4
    statement: "the skill states the stopping rule that ends refinement"
    verifier: independent_review
    verification_stage: pre_merge
    obligation: must
    mandate: [usability]
    traces: [C1]
    observation: "ask a reviewer when refinement is finished, using only the skill"
    decision: "the reviewer states a condition, not a judgment call"
    quantitative: false
  - id: W-1
    statement: "agents reach for the skill when starting an item without a boundary"
    verifier: observation
    verification_stage: production
    obligation: watch
    mandate: [usability]
    traces: [C2]
    observation: "for each item started, record whether the skill was invoked unprompted"
    decision: "the skill was invoked without being named"
    quantitative: false
