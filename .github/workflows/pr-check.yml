name: PR Check

on:
  pull_request:

env:
  CLAUDE_MIN_VERSION: 2.1.226
  CLAUDE_CURRENT_VERSION: 2.1.226
  CODEX_MIN_VERSION: 0.147.0
  CODEX_CURRENT_VERSION: 0.147.0

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The check that required it — modus/scripts/lint-slice-headers.js,
          # which read a pre-split specification out of git history — was removed in modus
          # 0.5.0, so nothing in the current chain reads past HEAD. Kept because the clone
          # costs well under a second at this size and a shallow default is the kind of
          # thing a future history-reading check discovers by silently verifying nothing.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm run install:all

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Validate plugin metadata
        run: npm run validate:plugins

      - name: Validate Claude plugin schemas
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.226 plugin validate . --strict
          plugins=$(node -e "require('./.claude-plugin/marketplace.json').plugins.forEach(plugin => console.log(plugin.name))") || exit 1
          while IFS= read -r plugin; do
            npx --yes @anthropic-ai/claude-code@2.1.226 plugin validate "$plugin" --strict
          done <<EOF
          $plugins
          EOF

      - name: Smoke test Codex plugin installs
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.147.0 plugin marketplace add .
          marketplace=$(node -p "require('./.claude-plugin/marketplace.json').name")
          for manifest in */.codex-plugin/plugin.json; do
            [ -e "$manifest" ] || continue
            plugin=${manifest%%/*}
            npx --yes @openai/codex@0.147.0 plugin add "${plugin}@${marketplace}"
          done

  # The bug this guards against is invisible on Linux. A hook command that names
  # no interpreter runs fine here — the shebang and the executable bit are enough
  # — and is dispatched through the `.js` file association on Windows, which is
  # Windows Script Host by default. WSH fails on the shebang and reports it in a
  # dialog, so the host reads no output and times out. Linux cannot reproduce
  # that, so the invocation suite has to actually run on Windows to mean anything.
  #
  # Scoped to the two suites that exercise hook startup. The rest of the chain,
  # the plugin schema checks, and the Codex smoke test assume a POSIX shell and
  # are already covered by the job above.
  hooks-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm run install:all

      - name: Run each hook registration through the Windows command path
        run: npx jest scripts/__tests__/hook-invocation.test.js scripts/__tests__/validate-plugins.test.js --runInBand

      # The herdr helper is the other half of the same class of defect: a seed
      # path that only quotes correctly on POSIX, a lock root that falls back to
      # a shared directory wherever getuid is absent — which is every Windows
      # user — and a cleanup that asks for no retries on an OS that raises
      # transient EPERM. None of it fails on Linux, so Linux cannot hold it.
      - name: Run the herdr helper suite on Windows
        run: npx jest comitatus/__tests__/herd.test.js --runInBand
